  async function runQuery() {
    const nql = queryInput.value.trim();
    if (!nql || !state.baseUrl) return;

    btnRun.disabled = true;
    btnRun.innerHTML = '<i class="ti ti-loader" style="font-size:14px;animation:spin 0.8s linear infinite;"></i>';
    resBody.innerHTML = `<div class="empty-msg">Ejecutando...</div>`;
    resInfo.textContent = "Ejecutando consulta...";

    if (!document.getElementById("spinStyle")) {
      const style = document.createElement("style");
      style.id = "spinStyle";
      style.textContent = "@keyframes spin { to { transform: rotate(360deg); } }";
      document.head.appendChild(style);
    }

    state.currentQuery = nql;

    const blockMatch = nql.match(/^\s*(FIND|GET)\s+(\S+)/i);
    if (blockMatch) {
      state.currentBlock = blockMatch[2];
    }

    const started = performance.now();

    try {
      const isFindOrGet = /^\s*(FIND|GET)\s+/i.test(nql);
      let finalNql = nql;

      if (isFindOrGet && !/LIMIT\s+/i.test(nql)) {
        const limit = limitSelect.value === "0" ? "" : ` LIMIT ${limitSelect.value}`;
        if (limit) finalNql = nql + limit;
      }

      const body = await executeQuery(finalNql);
      const elapsed = performance.now() - started;

      renderResults(body, elapsed, finalNql);

    } catch (err) {
      resBody.innerHTML = `<div class="error-msg"><i class="ti ti-alert-circle" style="margin-right:6px;"></i>${escapeHtml(err.message)}</div>`;
      resInfo.textContent = `Error: ${err.message}`;
    } finally {
      btnRun.disabled = false;
      btnRun.innerHTML = '<i class="ti ti-player-play" style="font-size:14px;"></i> Ejecutar';
    }
  }

  function renderResults(body, elapsed, nql) {
    if (Array.isArray(body.rows) && Array.isArray(body.columns)) {
      state.currentRows = body.rows;
      state.currentColumns = body.columns;

      resInfo.innerHTML = `<strong>${body.rows.length}</strong> filas · ${fmtDuration(elapsed)} · <span style="font-family:var(--mono);font-size:10px;">${escapeHtml(nql)}</span>`;

      if (body.rows.length === 0) {
        resBody.innerHTML = `<div class="empty-msg">Sin documentos. (${fmtDuration(elapsed)})</div>`;
        return;
      }

      renderTable(body.rows, body.columns);

    } else if (body && body.result !== undefined) {
      state.currentRows = [];
      state.currentColumns = [];
      const text = String(body.result);
      resInfo.innerHTML = `${fmtDuration(elapsed)} · <span style="font-family:var(--mono);font-size:10px;">${escapeHtml(nql)}</span>`;
      resBody.innerHTML = `<pre>${escapeHtml(text)}</pre>`;

    } else {
      state.currentRows = [];
      state.currentColumns = [];
      resInfo.innerHTML = `${fmtDuration(elapsed)} · <span style="font-family:var(--mono);font-size:10px;">${escapeHtml(nql)}</span>`;
      resBody.innerHTML = `<pre>${escapeHtml(JSON.stringify(body, null, 2))}</pre>`;
    }

    searchInput.value = "";
  }

  function renderTable(rows, columns) {
    const searchTerm = searchInput.value.trim().toLowerCase();
    let filteredRows = rows;
    if (searchTerm) {
      filteredRows = rows.filter(row => {
        return columns.some(col => {
          const v = (col === "_id" || col === "_shard_id") ? row[col] : row.data?.[col];
          return String(v).toLowerCase().includes(searchTerm);
        });
      });
    }

    const currentCols = columns.filter(c => c !== "_id" && c !== "_shard_id");
    let html = `<div class="table-actions">
      <button id="addColumnBtn"><i class="ti ti-plus"></i> Agregar Columna</button>
      <span class="current-columns-info">Columnas: <strong>${currentCols.length}</strong> (${currentCols.map(c => `<span style="font-family:var(--mono);font-size:9px;">${escapeHtml(c)}</span>`).join(', ')})</span>
    </div>`;
    
    html += `<div class="table-wrap"><table><thead><tr>`;
    columns.forEach(c => {
      html += `<th>${escapeHtml(c)}</th>`;
    });
    html += `<th style="width:100px;">Acciones</th></tr></thead><tbody>`;

    if (filteredRows.length === 0) {
      html += `<tr><td colspan="${columns.length + 1}" style="text-align:center;color:var(--txt3);padding:20px;">Sin coincidencias.</td></tr>`;
    } else {
      filteredRows.forEach((row, idx) => {
        const rowId = row._id || `row-${idx}`;
        html += `<tr data-rowid="${escapeHtml(rowId)}">`;
        columns.forEach(col => {
          const v = (col === "_id" || col === "_shard_id") ? row[col] : row.data?.[col];
          let cellContent = escapeHtml(fmtCell(v));
          if (isArrayField(v) && v.length > 0) {
            cellContent += ` <span class="array-badge" data-rowid="${escapeHtml(rowId)}" data-field="${escapeHtml(col)}">[${v.length} elementos]</span>`;
          }
          html += `<td>${cellContent}</td>`;
        });
        html += `<td>
          <div class="row-actions">
            <button class="edit" data-action="editRow" data-rowid="${escapeHtml(rowId)}" title="Editar Documento"><i class="ti ti-pencil"></i></button>
            <button class="add-field" data-action="addField" data-rowid="${escapeHtml(rowId)}" title="Agregar Campo"><i class="ti ti-plus"></i></button>
            <button class="clear-field" data-action="clearField" data-rowid="${escapeHtml(rowId)}" title="Eliminar Campo (dejar vacío)"><i class="ti ti-eraser"></i></button>
            <button class="del" data-action="deleteRow" data-rowid="${escapeHtml(rowId)}" title="Eliminar Documento"><i class="ti ti-trash"></i></button>
          </div>
        </td>`;
        html += `</tr>`;
      });
    }

    html += `</tbody></table></div>`;
    resBody.innerHTML = html;

    resBody.querySelectorAll("[data-action='editRow']").forEach(btn => {
      btn.addEventListener("click", () => {
        const rowId = btn.dataset.rowid;
        showEditRow(rowId);
      });
    });

    resBody.querySelectorAll("[data-action='addField']").forEach(btn => {
      btn.addEventListener("click", () => {
        const rowId = btn.dataset.rowid;
        showAddField(rowId);
      });
    });

    resBody.querySelectorAll("[data-action='clearField']").forEach(btn => {
      btn.addEventListener("click", () => {
        const rowId = btn.dataset.rowid;
        const row = state.currentRows.find(r => r._id === rowId);
        if (!row) return;
        
        const cols = state.currentColumns.filter(c => c !== "_id" && c !== "_shard_id");
        let optionsHtml = cols.map(c => {
          const val = row.data?.[c];
          if (val !== undefined && val !== null) {
            return `<option value="${escapeHtml(c)}">${escapeHtml(c)} (${escapeHtml(fmtCell(val).substring(0, 30))})</option>`;
          }
          return `<option value="${escapeHtml(c)}">${escapeHtml(c)} (vacío)</option>`;
        }).join("");

        if (!optionsHtml) {
          resInfo.textContent = "No hay campos para eliminar.";
          return;
        }

        showModal("Eliminar Campo", `
          <div class="field">
            <label>Seleccionar campo a eliminar</label>
            <select id="clearFieldSelect">${optionsHtml}</select>
          </div>
          <p style="color:var(--txt3);font-size:11px;">El campo quedará vacío (null) en este documento.</p>
          <input type="hidden" id="clearFieldRowId" value="${escapeHtml(rowId)}" />
        `, async () => {
          const id = document.getElementById("clearFieldRowId").value;
          const field = document.getElementById("clearFieldSelect").value;
          const block = getBlockName();

          if (!block) {
            showModalError("No se pudo determinar el bloque.");
            return;
          }

          if (!field) {
            showModalError("Seleccione un campo.");
            return;
          }

          try {
            await executeQuery(`UPDATE ${block} WHERE _id = "${id}" SET ${field} = null`);
            closeModal();
            await runQuery();
            resInfo.textContent = `Campo ${field} eliminado (null) del documento ${id}.`;
          } catch (err) {
            showModalError(err.message);
          }
        });
        document.querySelector("#modalSave").className = "btn-danger";
        document.querySelector("#modalSave").textContent = "Eliminar";
      });
    });

    resBody.querySelectorAll("[data-action='deleteRow']").forEach(btn => {
      btn.addEventListener("click", () => {
        const rowId = btn.dataset.rowid;
        showDeleteRow(rowId);
      });
    });

    resBody.querySelectorAll(".array-badge").forEach(badge => {
      badge.addEventListener("click", (e) => {
        e.stopPropagation();
        const rowId = badge.dataset.rowid;
        const field = badge.dataset.field;
        showEditArray(rowId, field);
      });
    });

    const addColumnBtn = document.getElementById("addColumnBtn");
    if (addColumnBtn) {
      addColumnBtn.addEventListener("click", showAddColumn);
    }
  }

  searchInput.addEventListener("input", () => {
    if (state.currentRows.length > 0 && state.currentColumns.length > 0) {
      renderTable(state.currentRows, state.currentColumns);
    }
  });

  modalClose.addEventListener("click", closeModal);
  modalCancel.addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  modalSave.addEventListener("click", () => {
    if (modalCallback) modalCallback();
  });

  connectForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    connectError.hidden = true;
    connectBtn.disabled = true;
    connectBtn.textContent = "Conectando…";

    const baseUrl = buildBaseUrl();
    const username = fUser.value.trim();
    const password = fPass.value;
    const db = fDb.value.trim() || "default";
    const authHeader = "Basic " + btoa(`${username}:${password}`);

    try {
      const res = await fetch(baseUrl + "/status", { headers: { Authorization: authHeader } });
      if (res.status === 401) throw new Error("Usuario o contraseña incorrectos.");
      if (!res.ok) throw new Error(`El servidor respondió ${res.status}.`);
      const status = await res.json();

      state.baseUrl = baseUrl;
      state.authHeader = authHeader;
      state.db = db;

      targetLabel.textContent = `${fHost.value}:${fPort.value} · ${status.node_id || "—"}`;
      connectScreen.style.display = "none";
      app.classList.add("visible");
      setStatus("ok", "conectado");

      await loadEntities();
      queryInput.value = "SHOW BLOCKS";
      runQuery();

    } catch (err) {
      connectError.textContent = err.message || "No se pudo conectar.";
      connectError.hidden = false;
      setStatus("err", "sin conexión");
    } finally {
      connectBtn.disabled = false;
      connectBtn.textContent = "Conectar";
    }
  });

  disconnectBtn.addEventListener("click", () => {
    state.baseUrl = "";
    state.authHeader = "";
    state.blocks = [];
    state.dbs = [];
    state.currentRows = [];
    state.currentColumns = [];
    fPass.value = "";
    app.classList.remove("visible");
    connectScreen.style.display = "flex";
    setStatus("err", "desconectado");
    resBody.innerHTML = `<div class="empty-msg">Desconectado.</div>`;
    resInfo.textContent = "Desconectado";
  });

  btnRun.addEventListener("click", runQuery);

  btnChart.addEventListener("click", showChartModal);

  queryInput.addEventListener("keydown", (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") {
      ev.preventDefault();
      runQuery();
    }
  });

  queryInput.addEventListener("input", () => {
    queryInput.style.height = "auto";
    queryInput.style.height = queryInput.scrollHeight + "px";
  });

  dbSelect.addEventListener("change", async () => {
    state.db = dbSelect.value;
    await loadEntities();
  });

  refreshBtn.addEventListener("click", loadEntities);

  document.querySelectorAll("[data-cmd]").forEach(btn => {
    btn.addEventListener("click", () => {
      queryInput.value = btn.dataset.cmd;
      runQuery();
    });
  });

  btnClear.addEventListener("click", () => {
    resBody.innerHTML = `<div class="empty-msg">Resultados limpiados.</div>`;
    resInfo.textContent = "Listo";
    state.currentRows = [];
    state.currentColumns = [];
    searchInput.value = "";
    chartInstances.forEach(c => {
      const gd = document.getElementById(c.id);
      if (gd && gd.data) { try { Plotly.purge(gd); } catch (e) { /* noop */ } }
    });
    chartInstances = [];
  });

  btnCopy.addEventListener("click", async () => {
    const text = resBody.textContent || "";
    try {
      await navigator.clipboard?.writeText(text);
      const icon = btnCopy.querySelector("i");
      icon.className = "ti ti-check";
      setTimeout(() => { icon.className = "ti ti-copy"; }, 1200);
    } catch {
      // fallback
    }
  });

  if (location.protocol !== "file:" && location.hostname) {
    fHost.value = location.hostname;
    if (location.port) fPort.value = location.port;
    fTls.checked = location.protocol === "https:";
  }

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CaimanDB UI</title>
<link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg0: #0d0d14;
  --bg1: #14141f;
  --bg2: #1a1a2e;
  --bg3: #22223a;
  --bg4: #2a2a46;
  --border: #2a2a46;
  --border2: #3a3a5a;
  --txt: #e0e0f0;
  --txt2: #a0a0c0;
  --txt3: #6a6a8a;
  --acc: #7aa9ff;
  --acc2: #5a8adf;
  --green: #8fcf8a;
  --red: #e07a8a;
  --yellow: #e8d07a;
  --orange: #e8b07a;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
  --display: 'Lexend', 'Inter', sans-serif;
  --radius: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.4);

  --plot-1: #6C9BD1;
  --plot-2: #4FB89A;
  --plot-3: #D4A24E;
  --plot-4: #C77B8B;
  --plot-5: #9C8BD9;
  --plot-6: #5FB0C9;
  --plot-7: #D18E5B;
  --plot-8: #7FBF7F;
  --plot-9: #B98BC9;
  --plot-10: #6FA8A0;
  --plot-grid: rgba(160,160,192,0.14);
  --plot-paper: #14141f;
  --plot-plot: #171727;
}

html, body {
  height: 100%;
  background: var(--bg0);
  color: var(--txt);
  font-family: var(--sans);
  font-size: 13px;
  overflow: hidden;
}

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: var(--bg1); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--txt3); }

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  outline: none;
  transition: border-color .15s, background .15s;
}
button { cursor: pointer; }
button:hover { background: var(--bg3); }
button:active { background: var(--bg4); }
input:focus, select:focus, textarea:focus { border-color: var(--acc); }

select option { background: var(--bg2); color: var(--txt); }

.connect-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.connect-card {
  width: 100%;
  max-width: 380px;
  padding: 32px 28px;
}

.connect-card .logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}
.connect-card .logo i {
  font-size: 28px;
  color: var(--acc);
}
.connect-card .logo h1 {
  font-family: var(--display);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.4px;
}
.connect-card .sub {
  color: var(--txt3);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.2px;
  margin-bottom: 24px;
  padding-left: 2px;
}

.field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 12px; }
.field label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--txt2);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.field-row .field:last-child { flex: 0 0 76px; }

.field-check {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--txt2);
  margin-bottom: 14px;
}
.field-check input { accent-color: var(--acc); width: 14px; height: 14px; }

.btn-primary {
  width: 100%;
  background: var(--acc);
  border: none;
  color: #0a0a14;
  font-weight: 700;
  padding: 10px;
  border-radius: var(--radius);
  transition: background .15s;
}
.btn-primary:hover { background: var(--acc2); }
.btn-primary:disabled { opacity: 0.5; cursor: default; }

.connect-error {
  margin-top: 12px;
  padding: 8px 12px;
  background: rgba(224,122,138,.12);
  border: 1px solid rgba(224,122,138,.25);
  border-radius: var(--radius);
  color: var(--red);
  font-size: 12px;
}

.app {
  display: none;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.app.visible { display: flex; }

.titlebar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  height: 40px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.titlebar .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.2px;
}
.titlebar .brand i { color: var(--acc); font-size: 18px; }
.titlebar .target {
  color: var(--txt3);
  font-family: var(--mono);
  font-size: 11px;
}
.titlebar .spacer { flex: 1; }
.titlebar .status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: var(--txt2);
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--txt3);
  flex-shrink: 0;
}
.status-dot.ok { background: var(--green); box-shadow: 0 0 6px rgba(143,207,138,.3); }
.status-dot.err { background: var(--red); box-shadow: 0 0 6px rgba(224,122,138,.3); }

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border);
  padding: 3px 12px;
  font-size: 11px;
  border-radius: var(--radius);
  color: var(--txt3);
}
.btn-ghost:hover { background: var(--bg2); color: var(--txt2); }

.body {
  flex: 1;
  display: flex;
  min-height: 0;
}

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--bg1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 12px 10px;
  overflow: hidden;
}

.sidebar .section-title {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--txt3);
  font-weight: 600;
  padding: 0 4px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar .section-title .title-actions {
  display: flex;
  gap: 2px;
}
.sidebar .section-title .title-actions button {
  background: none;
  border: none;
  padding: 0 3px;
  color: var(--txt3);
  font-size: 12px;
  cursor: pointer;
  border-radius: 3px;
}
.sidebar .section-title .title-actions button:hover {
  background: var(--bg2);
  color: var(--acc);
}
.sidebar .section-title .title-actions .del:hover { color: var(--red); }

.sidebar .db-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.sidebar .db-row select {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 8px;
  font-size: 12px;
  color: var(--txt);
  cursor: pointer;
}
.sidebar .db-row button {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 8px;
  color: var(--txt3);
  font-size: 14px;
}
.sidebar .db-row button:hover { color: var(--acc); }

.sidebar .block-list {
  flex: 1;
  overflow-y: auto;
  margin-top: 2px;
}
.sidebar .block-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--txt2);
  transition: background .1s, color .1s;
}
.sidebar .block-item:hover {
  background: var(--bg2);
  color: var(--txt);
}
.sidebar .block-item i {
  font-size: 13px;
  color: var(--txt3);
  transition: color .1s;
}
.sidebar .block-item:hover i { color: var(--acc); }
.sidebar .block-item .arrow {
  margin-left: auto;
  font-size: 14px;
  color: var(--txt3);
  opacity: 0.4;
}
.sidebar .block-item:hover .arrow { opacity: 0.8; color: var(--acc); }
.sidebar .block-item .block-actions {
  display: none;
  gap: 2px;
  margin-left: auto;
}
.sidebar .block-item:hover .block-actions { display: flex; }
.sidebar .block-item .block-actions button {
  background: none;
  border: none;
  padding: 2px 4px;
  color: var(--txt3);
  font-size: 12px;
  border-radius: 3px;
  cursor: pointer;
}
.sidebar .block-item .block-actions button:hover { background: var(--bg3); }
.sidebar .block-item .block-actions .del:hover { color: var(--red); }
.sidebar .block-item .block-actions .edit:hover { color: var(--yellow); }
.sidebar .block-item .block-actions .add-doc:hover { color: var(--green); }

.sidebar .empty-msg {
  color: var(--txt3);
  font-size: 11.5px;
  padding: 10px 6px;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
.toolbar .input-wrap {
  flex: 1;
  min-width: 180px;
  position: relative;
}
.toolbar .input-wrap textarea {
  width: 100%;
  height: 32px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 10px;
  color: var(--txt);
  font-family: var(--mono);
  font-size: 12.5px;
  resize: none;
  outline: none;
  line-height: 1.5;
  transition: border-color .15s;
}
.toolbar .input-wrap textarea:focus { border-color: var(--acc); }

.toolbar .btn-run {
  background: var(--acc);
  border: none;
  color: #0a0a14;
  font-weight: 600;
  padding: 4px 16px;
  border-radius: var(--radius);
  font-size: 12px;
  height: 32px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.toolbar .btn-run:hover { background: var(--acc2); }
.toolbar .btn-run:disabled { opacity: 0.5; }

.toolbar .btn-chart {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--txt2);
  font-weight: 600;
  padding: 4px 12px;
  border-radius: var(--radius);
  font-size: 12px;
  height: 32px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.toolbar .btn-chart:hover {
  background: var(--bg4);
  border-color: var(--acc);
  color: var(--acc);
}

.toolbar .limit-group {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--txt3);
}
.toolbar .limit-group select {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 3px 6px;
  font-size: 11px;
  color: var(--txt);
  cursor: pointer;
  height: 28px;
}

.toolbar .quick-group {
  display: flex;
  gap: 3px;
}
.toolbar .quick-group button {
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 3px 10px;
  font-size: 10.5px;
  font-family: var(--mono);
  color: var(--txt3);
  border-radius: var(--radius);
  height: 28px;
}
.toolbar .quick-group button:hover { color: var(--acc); border-color: var(--acc); }

.results {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}

.results .res-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 12px;
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  height: 32px;
  flex-wrap: wrap;
}
.results .res-header .info {
  font-size: 10.5px;
  color: var(--txt3);
}
.results .res-header .info strong { color: var(--txt2); font-weight: 500; }

.results .res-header .search-wrap {
  flex: 1;
  min-width: 120px;
  max-width: 300px;
  position: relative;
}
.results .res-header .search-wrap input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2px 8px 2px 28px;
  font-size: 11px;
  height: 24px;
  color: var(--txt);
}
.results .res-header .search-wrap input::placeholder { color: var(--txt3); }
.results .res-header .search-wrap i {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--txt3);
  font-size: 13px;
}

.results .res-header .actions {
  display: flex;
  gap: 2px;
}
.results .res-header .actions button {
  background: none;
  border: none;
  padding: 3px 7px;
  color: var(--txt3);
  border-radius: var(--radius);
  font-size: 14px;
  cursor: pointer;
}
.results .res-header .actions button:hover { background: var(--bg2); color: var(--acc); }

.results .res-body {
  flex: 1;
  overflow: auto;
  background: var(--bg0);
}

.results .res-body .empty-msg,
.results .res-body .error-msg {
  padding: 20px;
  font-size: 12.5px;
  color: var(--txt3);
}
.results .res-body .error-msg { color: var(--red); }

.results .res-body table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 11.5px;
}
.results .res-body th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg2);
  color: var(--txt2);
  font-weight: 500;
  padding: 5px 12px;
  text-align: left;
  border-bottom: 2px solid var(--border);
  font-family: var(--sans);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.results .res-body td {
  padding: 4px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--txt);
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.results .res-body tr:hover td { background: rgba(122,169,255,.04); }
.results .res-body tr td .row-actions {
  display: none;
  gap: 4px;
}
.results .res-body tr:hover td .row-actions { display: inline-flex; }
.results .res-body tr td .row-actions button {
  background: none;
  border: none;
  padding: 0 3px;
  color: var(--txt3);
  font-size: 13px;
  cursor: pointer;
  border-radius: 3px;
}
.results .res-body tr td .row-actions button:hover { background: var(--bg3); }
.results .res-body tr td .row-actions .edit:hover { color: var(--yellow); }
.results .res-body tr td .row-actions .del:hover { color: var(--red); }
.results .res-body tr td .row-actions .add-field:hover { color: var(--green); }
.results .res-body tr td .row-actions .clear-field:hover { color: var(--orange); }

.results .res-body .table-wrap { overflow: auto; }

.results .res-body pre {
  padding: 14px 16px;
  color: var(--txt2);
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.6;
}

.array-badge {
  display: inline-block;
  background: var(--bg3);
  color: var(--acc);
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 9px;
  margin-left: 4px;
  cursor: pointer;
  font-weight: 600;
  font-family: var(--sans);
  letter-spacing: 0.3px;
}
.array-badge:hover {
  background: var(--bg4);
  color: var(--acc2);
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px 28px;
  max-width: 95vw;
  width: 95%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
.modal .modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.modal .modal-header h2 {
  font-family: var(--display);
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: -0.2px;
}
.modal .modal-header .close {
  background: none;
  border: none;
  color: var(--txt3);
  font-size: 20px;
  cursor: pointer;
  padding: 0 4px;
}
.modal .modal-header .close:hover { color: var(--red); }

.modal .field {
  margin-bottom: 12px;
}
.modal .field label {
  font-size: 11px;
  font-weight: 600;
  color: var(--txt2);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.modal .field input,
.modal .field textarea,
.modal .field select {
  width: 100%;
  margin-top: 3px;
}
.modal .field textarea {
  min-height: 60px;
  resize: vertical;
  font-family: var(--mono);
  font-size: 12px;
}

.modal .dynamic-field {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  padding: 6px 8px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.modal .dynamic-field .field {
  flex: 1;
  margin-bottom: 0;
}
.modal .dynamic-field .field input {
  margin-top: 0;
}
.modal .dynamic-field .remove-field {
  background: none;
  border: none;
  color: var(--txt3);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
}
.modal .dynamic-field .remove-field:hover { color: var(--red); }

.modal .add-field-btn {
  background: none;
  border: 1px dashed var(--border2);
  color: var(--txt3);
  padding: 6px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  width: 100%;
  margin-top: 4px;
}
.modal .add-field-btn:hover {
  border-color: var(--acc);
  color: var(--acc);
  background: var(--bg2);
}

.modal .modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}
.modal .modal-actions button {
  padding: 6px 18px;
  border-radius: var(--radius);
  border: none;
  font-weight: 600;
  font-size: 12px;
}
.modal .modal-actions .btn-cancel {
  background: var(--bg3);
  color: var(--txt2);
}
.modal .modal-actions .btn-cancel:hover { background: var(--bg4); }
.modal .modal-actions .btn-save {
  background: var(--acc);
  color: #0a0a14;
}
.modal .modal-actions .btn-save:hover { background: var(--acc2); }
.modal .modal-actions .btn-danger {
  background: var(--red);
  color: #0a0a14;
}
.modal .modal-actions .btn-danger:hover { background: #c06a7a; }

.modal .modal-error {
  color: var(--red);
  font-size: 12px;
  margin-top: 8px;
  padding: 6px 10px;
  background: rgba(224,122,138,.1);
  border-radius: var(--radius);
}

.modal .block-selector {
  display: flex;
  gap: 8px;
  align-items: center;
}
.modal .block-selector select {
  flex: 1;
}

.array-item {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 6px;
}
.array-item input {
  flex: 1;
}
.array-item .remove-item {
  background: none;
  border: none;
  color: var(--txt3);
  font-size: 16px;
  cursor: pointer;
  padding: 0 4px;
}
.array-item .remove-item:hover { color: var(--red); }

.table-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 0px;
  padding: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.table-actions button {
  background: var(--bg2);
  border: 1px solid var(--border);
  padding: 4px 12px;
  font-size: 11px;
  border-radius: var(--radius);
  color: var(--txt2);
  display: flex;
  align-items: center;
  gap: 4px;
}
.table-actions button:hover {
  border-color: var(--acc);
  color: var(--acc);
}
.table-actions .danger-btn:hover {
  border-color: var(--red);
  color: var(--red);
}

<script>
(() => {
  "use strict";

  const state = {
    baseUrl: "",
    authHeader: "",
    db: "default",
    blocks: [],
    dbs: [],
    currentRows: [],
    currentColumns: [],
    currentQuery: "",
    currentBlock: "",
  };

  let chartInstances = [];
  let chartData = {};

  const $ = id => document.getElementById(id);
  const connectScreen = $("connectScreen");
  const connectForm = $("connectForm");
  const connectBtn = $("connectBtn");
  const connectError = $("connectError");
  const fHost = $("fHost");
  const fPort = $("fPort");
  const fDb = $("fDb");
  const fUser = $("fUser");
  const fPass = $("fPass");
  const fTls = $("fTls");

  const app = $("app");
  const targetLabel = $("targetLabel");
  const statusDot = $("statusDot");
  const statusText = $("statusText");
  const disconnectBtn = $("disconnectBtn");

  const dbSelect = $("dbSelect");
  const refreshBtn = $("refreshBtn");
  const addDbBtn = $("addDbBtn");
  const delDbBtn = $("delDbBtn");
  const addBlockBtn = $("addBlockBtn");
  const blockList = $("blockList");

  const queryInput = $("queryInput");
  const limitSelect = $("limitSelect");
  const btnRun = $("btnRun");
  const btnChart = $("btnChart");
  const resBody = $("resBody");
  const resInfo = $("resInfo");
  const searchInput = $("searchInput");
  const btnCopy = $("btnCopy");
  const btnClear = $("btnClear");

  const modalOverlay = $("modalOverlay");
  const modalTitle = $("modalTitle");
  const modalBody = $("modalBody");
  const modalError = $("modalError");
  const modalClose = $("modalClose");
  const modalCancel = $("modalCancel");
  const modalSave = $("modalSave");

  let modalCallback = null;

  function buildBaseUrl() {
    const scheme = fTls.checked ? "https" : "http";
    return `${scheme}://${fHost.value.trim() || "localhost"}:${fPort.value.trim() || "1555"}`;
  }

  async function apiFetch(path, opts = {}) {
    return fetch(state.baseUrl + path, {
      ...opts,
      headers: { Authorization: state.authHeader, ...(opts.headers || {}) },
    });
  }

  async function executeQuery(nql) {
    const url = `/query?db=${encodeURIComponent(state.db)}&query=${encodeURIComponent(nql)}`;
    const res = await apiFetch(url);
    if (res.status === 401) throw new Error("Credenciales rechazadas.");
    const body = await res.json().catch(() => null);
    if (!res.ok || (body && body.success === false)) {
      throw new Error(body?.error || body?.result || `Error HTTP ${res.status}`);
    }
    return body;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmtCell(v) {
    if (v === null || v === undefined) return "";
    if (typeof v === "object") return JSON.stringify(v);
    return String(v);
  }

  function fmtDuration(ms) {
    if (ms < 1000) return `${ms.toFixed(1)} ms`;
    return `${(ms / 1000).toFixed(2)} s`;
  }

  function setStatus(state, text) {
    statusDot.className = "status-dot" + (state === "ok" ? " ok" : state === "err" ? " err" : "");
    statusText.textContent = text;
  }

  function showModal(title, html, callback) {
    modalTitle.textContent = title;
    modalBody.innerHTML = html;
    modalError.hidden = true;
    modalCallback = callback;
    modalOverlay.classList.add("active");
    document.querySelector("#modalSave").className = "btn-save";
    document.querySelector("#modalSave").textContent = "Guardar";
  }

  function closeModal() {
    modalOverlay.classList.remove("active");
    modalCallback = null;
  }

  function showModalError(msg) {
    modalError.textContent = msg;
    modalError.hidden = false;
  }

  function isArrayField(value) {
    return Array.isArray(value);
  }

  function getBlockName() {
    return state.currentBlock || state.currentQuery.match(/FIND\s+(\S+)/i)?.[1] ||
           state.currentQuery.match(/GET\s+(\S+)/i)?.[1];
  }

  function isNumeric(value) {
    return !isNaN(parseFloat(value)) && isFinite(value);
  }

  const PALETTE = [
    '#6C9BD1', '#4FB89A', '#D4A24E', '#C77B8B', '#9C8BD9',
    '#5FB0C9', '#D18E5B', '#7FBF7F', '#B98BC9', '#6FA8A0'
  ];

  function getColorPalette(count) {
    const result = [];
    for (let i = 0; i < count; i++) result.push(PALETTE[i % PALETTE.length]);
    return result;
  }

  function hexToRgba(hex, alpha) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function mean(arr) { return arr.reduce((a, b) => a + b, 0) / (arr.length || 1); }
  function variance(arr) {
    const m = mean(arr);
    return arr.reduce((a, b) => a + Math.pow(b - m, 2), 0) / (arr.length || 1);
  }
  function stddev(arr) { return Math.sqrt(variance(arr)); }
  function quantile(sortedArr, q) {
    if (sortedArr.length === 0) return 0;
    const pos = (sortedArr.length - 1) * q;
    const base = Math.floor(pos);
    const rest = pos - base;
    if (sortedArr[base + 1] !== undefined) {
      return sortedArr[base] + rest * (sortedArr[base + 1] - sortedArr[base]);
    }
    return sortedArr[base];
  }
  function median(arr) {
    const s = [...arr].sort((a, b) => a - b);
    return quantile(s, 0.5);
  }
  function skewness(arr) {
    const m = mean(arr);
    const sd = stddev(arr);
    if (sd === 0) return 0;
    const n = arr.length;
    return arr.reduce((a, b) => a + Math.pow((b - m) / sd, 3), 0) / n;
  }
  function pearsonCorrelation(x, y) {
    const n = Math.min(x.length, y.length);
    if (n < 2) return 0;
    const mx = mean(x), my = mean(y);
    let num = 0, dx2 = 0, dy2 = 0;
    for (let i = 0; i < n; i++) {
      const dx = x[i] - mx, dy = y[i] - my;
      num += dx * dy; dx2 += dx * dx; dy2 += dy * dy;
    }
    const denom = Math.sqrt(dx2 * dy2);
    return denom === 0 ? 0 : num / denom;
  }

  function getAlignedNumericSeries(cols) {
    const series = {};
    cols.forEach(c => series[c] = []);
    state.currentRows.forEach(row => {
      let complete = true;
      cols.forEach(c => {
        const v = row.data?.[c];
        if (v === undefined || v === null || !isNumeric(v)) complete = false;
      });
      if (complete) cols.forEach(c => series[c].push(parseFloat(row.data[c])));
    });
    return series;
  }

  const PLOT_FONT = { family: "'Inter', sans-serif", size: 11, color: '#a0a0c0' };

  function baseLayout(extra = {}) {
    return Object.assign({
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: PLOT_FONT,
      margin: { t: 28, r: 20, b: 48, l: 56 },
      hoverlabel: {
        bgcolor: '#1a1a2e',
        bordercolor: '#3a3a5a',
        font: { family: "'JetBrains Mono', monospace", size: 11, color: '#e0e0f0' }
      },
      legend: { font: { size: 10, color: '#a0a0c0' }, bgcolor: 'rgba(0,0,0,0)' },
      xaxis: {
        gridcolor: 'rgba(160,160,192,0.12)', zerolinecolor: 'rgba(160,160,192,0.2)',
        tickfont: { size: 9.5 }, linecolor: '#2a2a46', automargin: true
      },
      yaxis: {
        gridcolor: 'rgba(160,160,192,0.12)', zerolinecolor: 'rgba(160,160,192,0.2)',
        tickfont: { size: 9.5 }, linecolor: '#2a2a46', automargin: true
      },
    }, extra);
  }

  const PLOT_CONFIG = {
    responsive: true,
    displaylogo: false,
    modeBarButtonsToRemove: ['lasso2d', 'select2d'],
    toImageButtonOptions: { format: 'png', scale: 2 }
  };

  function registerPlot(id, name) {
    const idx = chartInstances.findIndex(p => p.id === id);
    if (idx >= 0) chartInstances.splice(idx, 1);
    chartInstances.push({ id, name });
  }

  function downloadChart(divId, format, filename) {
    const gd = document.getElementById(divId);
    if (!gd || !gd.data) {
      showModalError("No se encontró la gráfica para descargar.");
      return;
    }
    const plotlyFormat = format === 'jpg' ? 'jpeg' : format;
    Plotly.toImage(gd, { format: plotlyFormat, width: 1200, height: 720, scale: 2 })
      .then(dataUrl => {
        const link = document.createElement('a');
        link.download = `${filename || 'grafica'}.${format}`;
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      })
      .catch(() => showModalError("No se pudo generar la imagen de la gráfica."));
  }

  function downloadAllChartsAsZip(format) {
    const targets = chartInstances.filter(p => {
      const gd = document.getElementById(p.id);
      return gd && gd.data;
    });
    if (targets.length === 0) {
      showModalError("No hay gráficas para descargar.");
      return;
    }
    const zip = new JSZip();
    const ext = format === 'jpg' ? 'jpg' : format;
    const plotlyFormat = format === 'jpg' ? 'jpeg' : format;

    Promise.all(targets.map(t =>
      Plotly.toImage(document.getElementById(t.id), { format: plotlyFormat, width: 1200, height: 720, scale: 2 })
        .then(dataUrl => ({ name: t.name, data: dataUrl.split(',')[1] }))
    )).then(results => {
      results.forEach(r => zip.file(`${r.name}.${ext}`, r.data, { base64: true }));
      zip.generateAsync({ type: 'blob' }).then(blob => saveAs(blob, `graficas_${format}.zip`));
    }).catch(() => showModalError("No se pudieron exportar todas las gráficas."));
  }

  function downloadSingleChartAsZip(divId, format, filename) {
    const gd = document.getElementById(divId);
    if (!gd || !gd.data) {
      showModalError("No se encontró la gráfica para descargar.");
      return;
    }
    const ext = format === 'jpg' ? 'jpg' : format;
    const plotlyFormat = format === 'jpg' ? 'jpeg' : format;
    Plotly.toImage(gd, { format: plotlyFormat, width: 1200, height: 720, scale: 2 }).then(dataUrl => {
      const zip = new JSZip();
      zip.file(`${filename || 'grafica'}.${ext}`, dataUrl.split(',')[1], { base64: true });
      zip.generateAsync({ type: 'blob' }).then(blob => saveAs(blob, `${filename || 'grafica'}.zip`));
    }).catch(() => showModalError("No se pudo generar la imagen de la gráfica."));
  }

  function generateAllCharts(auto = false) {
    const chartType = document.getElementById("chartType")?.value || "bar";
    const labelCol = document.getElementById("chartLabel")?.value;
    const valueCol = document.getElementById("chartValue")?.value;

    if (!labelCol || !valueCol) {
      if (!auto) showModalError("Seleccione columnas para la gráfica.");
      return;
    }

    const dataMap = new Map();
    state.currentRows.forEach(row => {
      const label = row.data?.[labelCol] !== undefined && row.data?.[labelCol] !== null
        ? String(row.data[labelCol])
        : "Sin valor";
      const value = row.data?.[valueCol];
      if (value !== undefined && value !== null && isNumeric(value)) {
        dataMap.set(label, (dataMap.get(label) || 0) + parseFloat(value));
      }
    });

    if (dataMap.size === 0) {
      if (!auto) showModalError("No hay datos numéricos para graficar.");
      return;
    }

    const sortedData = Array.from(dataMap.entries()).sort((a, b) => b[1] - a[1]);
    const labels = sortedData.map(d => d[0]);
    const values = sortedData.map(d => d[1]);

    const total = values.reduce((a, b) => a + b, 0);
    const avg = mean(values);
    const max = Math.max(...values);
    const min = Math.min(...values);
    const med = median(values);
    const sd = stddev(values);

    document.getElementById('badge1').textContent = values.length;
    document.getElementById('badge2').textContent = Math.min(values.length, 15);

    const metricsHtml = `
      <div class="metric-card">
        <div class="metric-value">${total.toFixed(2)}</div>
        <div class="metric-label">Total</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${avg.toFixed(2)}</div>
        <div class="metric-label">Promedio</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${med.toFixed(2)}</div>
        <div class="metric-label">Mediana</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${sd.toFixed(2)}</div>
        <div class="metric-label">Desviación Estándar</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${max.toFixed(2)}</div>
        <div class="metric-label">Máximo</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${min.toFixed(2)}</div>
        <div class="metric-label">Mínimo</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${state.currentRows.length}</div>
        <div class="metric-label">Registros</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">${dataMap.size}</div>
        <div class="metric-label">Categorías</div>
      </div>
    `;
    document.getElementById("chartMetrics").innerHTML = metricsHtml;

    renderMainChart('plotMain', chartType, labels, values, valueCol);

    const topLabels = labels.slice(0, 15);
    const topValues = values.slice(0, 15);
    renderMainChart('plotDist', 'doughnut', topLabels, topValues, valueCol);

    const numericCols = state.currentColumns.filter(c => {
      return c !== "_id" && c !== "_shard_id" && state.currentRows.some(row => {
        const val = row.data?.[c];
        return val !== undefined && val !== null && isNumeric(val);
      });
    });
    if (numericCols.length > 1) {
      const multiSelect = document.getElementById("multiChartValues");
      if (multiSelect) {
        const options = multiSelect.options;
        for (let i = 0; i < options.length && i < 3; i++) {
          options[i].selected = true;
        }
        generateMultiChart();
      }
    }
  }

  function renderMainChart(divId, type, labels, values, label) {
    const gd = document.getElementById(divId);
    if (!gd) return;
    const colors = getColorPalette(labels.length);

    let data, layout;
    if (type === 'pie' || type === 'doughnut') {
      data = [{
        type: 'pie', labels, values,
        hole: type === 'doughnut' ? 0.55 : 0,
        marker: { colors, line: { color: '#0d0d14', width: 1.5 } },
        textinfo: 'percent',
        textfont: { size: 10, color: '#0a0a14' },
        hovertemplate: '%{label}: %{value:.2f} (%{percent})<extra></extra>'
      }];
      layout = baseLayout({ showlegend: true, legend: { orientation: 'v', font: { size: 9.5 } } });
    } else if (type === 'radar' || type === 'polarArea') {
      const closingLabels = [...labels, labels[0]];
      const closingValues = [...values, values[0]];
      data = [{
        type: type === 'radar' ? 'scatterpolar' : 'barpolar',
        r: type === 'radar' ? closingValues : values,
        theta: type === 'radar' ? closingLabels : labels,
        fill: type === 'radar' ? 'toself' : undefined,
        marker: {
          color: type === 'radar' ? hexToRgba(PALETTE[0], 0.35) : colors,
          line: { color: PALETTE[0], width: 1.5 }
        },
        line: { color: PALETTE[0] }
      }];
      layout = baseLayout({
        polar: {
          bgcolor: 'rgba(0,0,0,0)',
          radialaxis: { gridcolor: 'rgba(160,160,192,0.15)', tickfont: { size: 8.5 } },
          angularaxis: { gridcolor: 'rgba(160,160,192,0.15)', tickfont: { size: 9 } }
        }
      });
    } else if (type === 'line') {
      data = [{
        type: 'scatter', mode: 'lines+markers', x: labels, y: values,
        line: { color: PALETTE[0], width: 2.5, shape: 'spline' },
        marker: { color: PALETTE[0], size: 6 },
        fill: 'tozeroy', fillcolor: hexToRgba(PALETTE[0], 0.12)
      }];
      layout = baseLayout({ xaxis: { tickangle: -35 }, yaxis: { title: label, rangemode: 'tozero' } });
    } else {
      const horizontal = type === 'horizontalBar';
      data = [{
        type: 'bar',
        x: horizontal ? values : labels,
        y: horizontal ? labels : values,
        orientation: horizontal ? 'h' : 'v',
        marker: { color: colors, line: { width: 0 } },
        hovertemplate: horizontal ? '%{y}: %{x:.2f}<extra></extra>' : '%{x}: %{y:.2f}<extra></extra>'
      }];
      layout = baseLayout(horizontal
        ? { xaxis: { title: label, rangemode: 'tozero' }, yaxis: { automargin: true }, margin: { t: 20, r: 20, b: 40, l: 130 } }
        : { xaxis: { tickangle: -35 }, yaxis: { title: label, rangemode: 'tozero' } });
    }

    Plotly.newPlot(gd, data, layout, PLOT_CONFIG);
    registerPlot(divId, divId === 'plotMain' ? 'grafica_principal' : 'grafica_distribucion');
  }

  function generateMultiChart() {
    const multiSelect = document.getElementById("multiChartValues");
    if (!multiSelect) return;

    const selectedValues = [];
    for (let i = 0; i < multiSelect.options.length; i++) {
      if (multiSelect.options[i].selected) {
        selectedValues.push(multiSelect.options[i].value);
      }
    }

    if (selectedValues.length === 0) {
      showModalError("Seleccione al menos una columna para comparar.");
      return;
    }

    const labelCol = document.getElementById("chartLabel")?.value;
    if (!labelCol) {
      showModalError("Seleccione una columna para las etiquetas.");
      return;
    }

    const dataMap = new Map();
    state.currentRows.forEach(row => {
      const label = row.data?.[labelCol] !== undefined && row.data?.[labelCol] !== null
        ? String(row.data[labelCol])
        : "Sin valor";
      if (!dataMap.has(label)) {
        dataMap.set(label, {});
      }
      const entry = dataMap.get(label);
      selectedValues.forEach(col => {
        const val = row.data?.[col];
        if (val !== undefined && val !== null && isNumeric(val)) {
          entry[col] = (entry[col] || 0) + parseFloat(val);
        }
      });
    });

    const labels = Array.from(dataMap.keys());
    const colors = getColorPalette(selectedValues.length);

    const data = selectedValues.map((col, index) => ({
      type: 'scatter',
      mode: 'lines+markers',
      name: col,
      x: labels,
      y: labels.map(l => dataMap.get(l)[col] || 0),
      line: { color: colors[index], width: 2.5, shape: 'spline' },
      marker: { color: colors[index], size: 5 }
    }));

    const layout = baseLayout({ xaxis: { tickangle: -35 }, yaxis: { rangemode: 'tozero' }, showlegend: true });

    const gd = document.getElementById('plotMulti');
    if (!gd) return;
    Plotly.newPlot(gd, data, layout, PLOT_CONFIG);
    registerPlot('plotMulti', 'grafica_comparativa');
    document.getElementById('badge3').textContent = selectedValues.length;
  }

  function renderStatsPanel(numericCols) {
    const wrap = document.getElementById('statsTableWrap');
    const insightsWrap = document.getElementById('insightsWrap');
    if (!wrap) return;

    if (numericCols.length === 0) {
      wrap.innerHTML = '<div class="empty-msg">No hay columnas numéricas en este resultado para analizar.</div>';
      if (insightsWrap) insightsWrap.innerHTML = '';
      const corrDiv = document.getElementById('plotCorr');
      if (corrDiv) corrDiv.innerHTML = '<div class="empty-msg">Se requieren columnas numéricas para calcular correlaciones.</div>';
      const histMain = document.getElementById('plotHistMain');
      const histBox = document.getElementById('plotHistBox');
      if (histMain) histMain.innerHTML = '<div class="empty-msg">Sin columnas numéricas.</div>';
      if (histBox) histBox.innerHTML = '';
      return;
    }

    const series = getAlignedNumericSeries(numericCols);
    const colors = getColorPalette(numericCols.length);
    const stats = numericCols.map((c, i) => {
      const raw = state.currentRows
        .map(r => r.data?.[c])
        .filter(v => v !== undefined && v !== null && isNumeric(v))
        .map(v => parseFloat(v));
      const sorted = [...raw].sort((a, b) => a - b);
      return {
        col: c, color: colors[i], count: raw.length,
        mean: mean(raw), std: stddev(raw),
        min: sorted[0] ?? 0, q25: quantile(sorted, 0.25), q50: quantile(sorted, 0.5),
        q75: quantile(sorted, 0.75), max: sorted[sorted.length - 1] ?? 0,
        skew: skewness(raw)
      };
    });

    const rows = stats.map(s => `
      <tr>
        <td><span class="col-swatch" style="background:${s.color};"></span>${escapeHtml(s.col)}</td>
        <td>${s.count}</td>
        <td>${s.mean.toFixed(3)}</td>
        <td>${s.std.toFixed(3)}</td>
        <td>${s.min.toFixed(3)}</td>
        <td>${s.q25.toFixed(3)}</td>
        <td>${s.q50.toFixed(3)}</td>
        <td>${s.q75.toFixed(3)}</td>
        <td>${s.max.toFixed(3)}</td>
        <td>${s.skew.toFixed(3)}</td>
      </tr>
    `).join('');

    wrap.innerHTML = `
      <table class="stats-table">
        <thead>
          <tr>
            <th>Columna</th><th>N</th><th>Media</th><th>Desv. Est.</th>
            <th>Mín</th><th>Q1 (25%)</th><th>Mediana</th><th>Q3 (75%)</th><th>Máx</th><th>Asimetría</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    const insights = [];
    const mostVariable = [...stats].sort((a, b) =>
      (b.std / (Math.abs(b.mean) || 1)) - (a.std / (Math.abs(a.mean) || 1))
    )[0];
    if (mostVariable) {
      const cv = ((mostVariable.std / (Math.abs(mostVariable.mean) || 1)) * 100).toFixed(1);
      insights.push(`<div class="insight-card"><div class="insight-label">Mayor variabilidad relativa</div><div class="insight-text"><strong>${escapeHtml(mostVariable.col)}</strong> — coeficiente de variación de ${cv}%</div></div>`);
    }
    stats.forEach(s => {
      if (Math.abs(s.skew) > 1) {
        insights.push(`<div class="insight-card"><div class="insight-label">Distribución sesgada</div><div class="insight-text"><strong>${escapeHtml(s.col)}</strong> tiene un sesgo ${s.skew > 0 ? 'positivo' : 'negativo'} (${s.skew.toFixed(2)}), lo que sugiere posibles valores atípicos.</div></div>`);
      }
    });

    if (numericCols.length > 1) {
      let bestPair = null;
      for (let i = 0; i < numericCols.length; i++) {
        for (let j = i + 1; j < numericCols.length; j++) {
          const a = series[numericCols[i]], b = series[numericCols[j]];
          if (a.length < 2) continue;
          const r = pearsonCorrelation(a, b);
          if (!bestPair || Math.abs(r) > Math.abs(bestPair.r)) bestPair = { x: numericCols[i], y: numericCols[j], r };
        }
      }
      if (bestPair && Math.abs(bestPair.r) > 0.05) {
        const strength = Math.abs(bestPair.r) > 0.7 ? 'fuerte' : Math.abs(bestPair.r) > 0.4 ? 'moderada' : 'débil';
        insights.push(`<div class="insight-card"><div class="insight-label">Correlación más fuerte</div><div class="insight-text"><strong>${escapeHtml(bestPair.x)}</strong> ↔ <strong>${escapeHtml(bestPair.y)}</strong>: r = ${bestPair.r.toFixed(3)} (${strength})</div></div>`);
      }
    }

    if (insightsWrap) {
      insightsWrap.innerHTML = insights.length ? `<div class="insight-grid">${insights.join('')}</div>` : '';
    }

    renderCorrelationHeatmap(numericCols, series);

    if (numericCols.length > 0) renderHistogramBox(numericCols[0]);
  }

  function renderCorrelationHeatmap(numericCols, series) {
    const gd = document.getElementById('plotCorr');
    if (!gd) return;
    if (numericCols.length < 2) {
      gd.innerHTML = '<div class="empty-msg">Se requieren al menos dos columnas numéricas para calcular correlaciones.</div>';
      return;
    }
    series = series || getAlignedNumericSeries(numericCols);
    const n = numericCols.length;
    const z = [];
    for (let i = 0; i < n; i++) {
      const row = [];
      for (let j = 0; j < n; j++) {
        const a = series[numericCols[i]], b = series[numericCols[j]];
        row.push(a.length > 1 ? pearsonCorrelation(a, b) : (i === j ? 1 : 0));
      }
      z.push(row);
    }
    const textVals = z.map(row => row.map(v => v.toFixed(2)));

    const data = [{
      type: 'heatmap', z, x: numericCols, y: numericCols,
      colorscale: [[0, '#C77B8B'], [0.5, '#171727'], [1, '#4FB89A']],
      zmin: -1, zmax: 1,
      text: textVals, texttemplate: '%{text}', textfont: { size: 10 },
      hovertemplate: '%{x} ↔ %{y}: %{z:.3f}<extra></extra>',
      colorbar: { thickness: 12, tickfont: { size: 9, color: '#a0a0c0' } }
    }];
    const layout = baseLayout({ margin: { t: 20, r: 20, b: 70, l: 90 }, xaxis: { tickangle: -35 } });
    Plotly.newPlot(gd, data, layout, PLOT_CONFIG);
    registerPlot('plotCorr', 'matriz_correlacion');
  }

  function renderHistogramBox(col) {
    const histWrap = document.getElementById('plotHistMain');
    const boxWrap = document.getElementById('plotHistBox');
    if (!histWrap || !boxWrap) return;

    const values = state.currentRows
      .map(r => r.data?.[col])
      .filter(v => v !== undefined && v !== null && isNumeric(v))
      .map(v => parseFloat(v));

    if (values.length === 0) {
      histWrap.innerHTML = '<div class="empty-msg">Sin datos numéricos para esta columna.</div>';
      boxWrap.innerHTML = '';
      return;
    }

    const histData = [{
      type: 'histogram', x: values,
      marker: { color: hexToRgba(PALETTE[0], 0.75), line: { color: PALETTE[0], width: 1 } },
      opacity: 0.9,
      nbinsx: Math.min(30, Math.max(8, Math.round(Math.sqrt(values.length))))
    }];
    const histLayout = baseLayout({ bargap: 0.04, xaxis: { title: col }, yaxis: { title: 'Frecuencia' } });
    Plotly.newPlot(histWrap, histData, histLayout, PLOT_CONFIG);

    const boxData = [{
      type: 'box', y: values, name: col, boxpoints: 'outliers',
      marker: { color: PALETTE[3] }, line: { color: PALETTE[3] },
      fillcolor: hexToRgba(PALETTE[3], 0.2)
    }];
    const boxLayout = baseLayout({ yaxis: { title: col }, showlegend: false });
    Plotly.newPlot(boxWrap, boxData, boxLayout, PLOT_CONFIG);

    registerPlot('plotHistMain', `histograma_${col}`);
    registerPlot('plotHistBox', `diagrama_caja_${col}`);
  }

  async function loadEntities() {
    try {
      const res = await apiFetch(`/entities?db=${encodeURIComponent(state.db)}`);
      if (!res.ok) return;
      const data = await res.json();
      state.dbs = data.dbs || [];
      state.blocks = data.blocks || [];

      dbSelect.innerHTML = state.dbs.map(d =>
        `<option value="${escapeHtml(d)}" ${d === state.db ? "selected" : ""}>${escapeHtml(d)}</option>`
      ).join("") || `<option>${escapeHtml(state.db)}</option>`;

      if (state.blocks.length === 0) {
        blockList.innerHTML = `<div class="empty-msg">Sin bloques en "${escapeHtml(state.db)}"</div>`;
        return;
      }

      blockList.innerHTML = state.blocks.map(b =>
        `<div class="block-item" data-block="${escapeHtml(b.name)}">

          <span>${escapeHtml(b.name)}</span>

        </div>`
      ).join("");

      blockList.querySelectorAll(".block-item").forEach(el => {
        const block = el.dataset.block;
        el.addEventListener("click", (e) => {
          if (e.target.closest(".block-actions")) return;
          const limit = limitSelect.value === "0" ? "" : ` LIMIT ${limitSelect.value}`;
          queryInput.value = `FIND ${block}${limit}`;
          state.currentBlock = block;
          runQuery();

        el.querySelectorAll("[data-action]").forEach(btn => {

  function showAddRowFromBlock(blockName) {
    // Primero intentamos obtener la estructura del bloque
    executeQuery(`FIND ${blockName} LIMIT 1`)
      .then(body => {
        const cols = body.columns ? body.columns.filter(c => c !== "_id" && c !== "_shard_id") : [];
        
        if (cols.length === 0) {
          // Si no hay columnas, usamos el modo dinámico completo
          showDynamicAddDocument(blockName, []);
          return;
        }
        
        // Si hay columnas, mostramos la versión con campos predefinidos + campos dinámicos adicionales
        showStructuredAddDocument(blockName, cols);
      })
      .catch(() => {
        // Si falla la consulta, usamos el modo dinámico
        showDynamicAddDocument(blockName, []);
      });
  }

  // ============================================================
  // VERSIÓN CON CAMPOS ESTRUCTURADOS (cuando hay tabla)
  // ============================================================
  function showStructuredAddDocument(blockName, cols) {
    let fieldsHtml = cols.map(c => `
      <div class="field">
        <label>${escapeHtml(c)}</label>
        <input type="text" class="structured-field" data-field="${escapeHtml(c)}" placeholder="valor" />
      </div>
    `).join("");

    showModal(`Agregar Documento a "${blockName}"`, `
      <div class="field">
        <label>ID personalizado (opcional)</label>
        <input type="text" id="customDocId" placeholder="dejar vacío para ID automático" />
        <span style="font-size:9px;color:var(--txt3);margin-top:2px;">Ejemplo: "usuario_123" o "doc-001"</span>
      </div>
      <div class="field">
        <label>Bloque destino</label>
        <input type="text" value="${escapeHtml(blockName)}" disabled />
      </div>
      <p style="color:var(--txt3);font-size:11px;margin-bottom:12px;">Campos de la tabla <strong style="color:var(--acc);">${escapeHtml(blockName)}</strong></p>
      ${fieldsHtml}
      
      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
        <p style="color:var(--txt3);font-size:11px;margin-bottom:8px;">Campos adicionales (opcional)</p>

      </div>
      
      <div class="field" style="margin-top:8px;">
        <label>Vista previa (JSON)</label>
        <textarea id="jsonPreview" style="font-family:var(--mono);font-size:11px;background:var(--bg1);height:60px;" readonly>{
  "campo": "valor"
}</textarea>
      </div>
      <input type="hidden" id="addStructuredBlock" value="${escapeHtml(blockName)}" />
    `, async () => {
      const block = document.getElementById("addStructuredBlock").value;
      const customId = document.getElementById("customDocId").value.trim();
      const doc = {};
      let hasData = false;

      // Obtener campos estructurados
      document.querySelectorAll('.structured-field').forEach(el => {
        const fieldName = el.dataset.field;
        const val = el.value.trim();
        if (val) {
          let parsed;
          try { parsed = JSON.parse(val); } catch { parsed = val; }
          doc[fieldName] = parsed;
          hasData = true;
        }
      });

      // Obtener campos dinámicos adicionales
      document.querySelectorAll('#dynamicFieldsContainer .dynamic-field').forEach(el => {
        const nameInput = el.querySelector(".dynamic-field-name");
        const valueInput = el.querySelector(".dynamic-field-value");
        const typeSelect = el.querySelector(".dynamic-field-type");
        const name = nameInput.value.trim();
        const value = valueInput.value.trim();
        const type = typeSelect ? typeSelect.value : "string";

        if (name && value) {
          let parsedValue = value;
          switch (type) {
            case "number":
              parsedValue = parseFloat(value);
              break;
            case "boolean":
              parsedValue = value.toLowerCase() === "true" || value.toLowerCase() === "1";
              break;
            case "null":
              parsedValue = null;
              break;
            case "array":
              try { parsedValue = JSON.parse(value); } catch { parsedValue = value; }
              break;
            case "object":
              try { parsedValue = JSON.parse(value); } catch { parsedValue = value; }
              break;
            default:
              parsedValue = value;
          }
          doc[name] = parsedValue;
          hasData = true;
        }
      });

      if (!hasData) {
        showModalError("Complete al menos un campo.");
        return;
      }

      try {
        let nql;
        if (customId) {
          nql = `INSERT ${block} ${customId} ${JSON.stringify(doc)}`;
        } else {
          nql = `INSERT ${block} ${JSON.stringify(doc)}`;
        }
        await executeQuery(nql);
        closeModal();
        await runQuery();
        resInfo.textContent = `Documento agregado a ${block}${customId ? ` con ID: ${customId}` : ''}.`;
      } catch (err) {
        showModalError(err.message);
      }
    });

      const doc = {};

      document.querySelectorAll('.structured-field').forEach(el => {
        const fieldName = el.dataset.field;

        if (val) {

          try { parsed = JSON.parse(val); } catch { parsed = val; }
          doc[fieldName] = parsed;
        }
      });

      document.querySelectorAll('#dynamicFieldsContainer .dynamic-field').forEach(el => {
        const nameInput = el.querySelector(".dynamic-field-name");
        const valueInput = el.querySelector(".dynamic-field-value");
        const typeSelect = el.querySelector(".dynamic-field-type");
        const name = nameInput.value.trim();
        const value = valueInput.value.trim();
        const type = typeSelect ? typeSelect.value : "string";

        if (name && value) {
          let parsedValue = value;
          switch (type) {
            case "number":
              parsedValue = parseFloat(value);
              break;
            case "boolean":
              parsedValue = value.toLowerCase() === "true" || value.toLowerCase() === "1";
              break;
            case "null":
              parsedValue = null;
              break;
            case "array":
              try { parsedValue = JSON.parse(value); } catch { parsedValue = value; }
              break;
            case "object":
              try { parsedValue = JSON.parse(value); } catch { parsedValue = value; }
              break;
            default:
              parsedValue = value;
          }
          doc[name] = parsedValue;
        }
      });

      const customId = document.getElementById("customDocId")?.value.trim() || "";
      const block = document.getElementById("addStructuredBlock")?.value || "bloque";
      
      let previewText;
      if (Object.keys(doc).length === 0) {
        previewText = '{\n  "campo": "valor"\n}';
      } else if (customId) {
        previewText = `INSERT ${block} ${customId} ${JSON.stringify(doc, null, 2)}`;
      } else {
        previewText = `INSERT ${block} ${JSON.stringify(doc, null, 2)}`;
      }
      preview.value = previewText;
    }

    setTimeout(() => {
      // Eventos para actualizar la vista previa
      document.querySelectorAll('.structured-field, #customDocId').forEach(el => {
        el.addEventListener("input", updateStructuredPreview);
        el.addEventListener("change", updateStructuredPreview);
      });

      // Botón para agregar campos dinámicos
      const addBtn = document.getElementById("addDynamicFieldBtn");
      if (addBtn) {
        addBtn.addEventListener("click", () => {
          const container = document.getElementById("dynamicFieldsContainer");
          const div = document.createElement("div");
          div.className = "dynamic-field";
          div.innerHTML = `
            <div class="field" style="flex:2;">
              <label>Nombre del campo</label>
              <input type="text" class="dynamic-field-name" placeholder="nombre" />
            </div>
            <div class="field" style="flex:3;">
              <label>Valor (JSON válido)</label>
              <input type="text" class="dynamic-field-value" placeholder='"valor" o 123 o ["a","b"]' />
            </div>
            <div class="field" style="flex:1.5;">
              <label>Tipo</label>
              <select class="dynamic-field-type">
                <option value="string">Texto</option>
                <option value="number">Número</option>
                <option value="boolean">Booleano</option>
                <option value="null">Nulo</option>
                <option value="array">Array</option>
                <option value="object">Objeto</option>
              </select>
            </div>
            <button class="remove-field" style="margin-top:18px;" title="Eliminar campo"><i class="ti ti-x"></i></button>
          `;
          container.appendChild(div);
          div.querySelector(".remove-field").addEventListener("click", () => {
            div.remove();
            updateStructuredPreview();
          });
          
          // Agregar eventos para actualizar preview
          div.querySelectorAll("input, select").forEach(el => {
            el.addEventListener("input", updateStructuredPreview);
            el.addEventListener("change", updateStructuredPreview);
          });
          
          updateStructuredPreview();
        });
      }

      // Inicializar preview
      updateStructuredPreview();
    }, 100);
  }

            case "array":

              break;
            case "object":
              try { parsedValue = JSON.parse(value); } catch { parsedValue = value; }
              break;
            default:
              parsedValue = value;
          }
          doc[name] = parsedValue;
          hasData = true;
        }
      });

      if (!hasData) {
        showModalError("Complete al menos un campo con nombre y valor.");
        return;
      }

      try {
        let nql;
        if (customId) {
          nql = `INSERT ${block} ${customId} ${JSON.stringify(doc)}`;
        } else {
          nql = `INSERT ${block} ${JSON.stringify(doc)}`;
        }
        await executeQuery(nql);
        closeModal();
        await runQuery();
        resInfo.textContent = `Documento agregado a ${block}${customId ? ` con ID: ${customId}` : ''}.`;
      } catch (err) {
        showModalError(err.message);
      }
    });

    // Función para actualizar la vista previa en tiempo real (versión dinámica)
    function updateDynamicPreview() {
      const preview = document.getElementById("jsonPreviewDynamic");
      if (!preview) return;
      
      const doc = {};
      const containers = document.querySelectorAll("#dynamicFieldsContainer .dynamic-field");
      containers.forEach(el => {
        const nameInput = el.querySelector(".dynamic-field-name");
        const valueInput = el.querySelector(".dynamic-field-value");
        const typeSelect = el.querySelector(".dynamic-field-type");
        const name = nameInput.value.trim();
        const value = valueInput.value.trim();
        const type = typeSelect ? typeSelect.value : "string";

        if (name && value) {
          let parsedValue = value;
          switch (type) {
            case "number":
              parsedValue = parseFloat(value);
              break;
            case "boolean":
              parsedValue = value.toLowerCase() === "true" || value.toLowerCase() === "1";
              break;
            case "null":
              parsedValue = null;
              break;
            case "array":
              try { parsedValue = JSON.parse(value); } catch { parsedValue = value; }
              break;
            case "object":
              try { parsedValue = JSON.parse(value); } catch { parsedValue = value; }
              break;
            default:
              parsedValue = value;
          }
          doc[name] = parsedValue;
        }
      });

      const customId = document.getElementById("customDocIdDynamic")?.value.trim() || "";
      const block = document.getElementById("addDynamicBlock")?.value || "bloque";
      
      let previewText;
      if (Object.keys(doc).length === 0) {
        previewText = '{\n  "campo": "valor"\n}';
      } else if (customId) {
        previewText = `INSERT ${block} ${customId} ${JSON.stringify(doc, null, 2)}`;
      } else {
        previewText = `INSERT ${block} ${JSON.stringify(doc, null, 2)}`;
      }
      preview.value = previewText;
    }

    setTimeout(() => {
      // Eventos para actualizar la vista previa
      const container = document.getElementById("dynamicFieldsContainer");
      const customIdInput = document.getElementById("customDocIdDynamic");
      
      if (container) {
        container.addEventListener("input", updateDynamicPreview);
        container.addEventListener("change", updateDynamicPreview);
      }
      if (customIdInput) {
        customIdInput.addEventListener("input", updateDynamicPreview);
      }

      const addBtn = document.getElementById("addDynamicFieldBtn");
      if (addBtn) {
        addBtn.addEventListener("click", () => {
          const container = document.getElementById("dynamicFieldsContainer");
          const div = document.createElement("div");
          div.className = "dynamic-field";
          div.innerHTML = `
            <div class="field" style="flex:2;">
              <label>Nombre del campo</label>
              <input type="text" class="dynamic-field-name" placeholder="nombre" />
            </div>
            <div class="field" style="flex:3;">
              <label>Valor (JSON válido)</label>
              <input type="text" class="dynamic-field-value" placeholder='"valor" o 123 o ["a","b"]' />
            </div>
            <div class="field" style="flex:1.5;">
              <label>Tipo</label>
              <select class="dynamic-field-type">
                <option value="string">Texto</option>
                <option value="number">Número</option>
                <option value="boolean">Booleano</option>
                <option value="null">Nulo</option>
                <option value="array">Array</option>
                <option value="object">Objeto</option>
              </select>
            </div>
            <button class="remove-field" style="margin-top:18px;" title="Eliminar campo"><i class="ti ti-x"></i></button>
          `;
          container.appendChild(div);
          div.querySelector(".remove-field").addEventListener("click", () => {
            if (container.children.length > 1) {
              div.remove();
              updateDynamicPreview();
            }
          });
          
          div.querySelectorAll("input, select").forEach(el => {
            el.addEventListener("input", updateDynamicPreview);
            el.addEventListener("change", updateDynamicPreview);
          });
          
          updateDynamicPreview();
        });
      }

      document.querySelectorAll("#dynamicFieldsContainer .remove-field").forEach(btn => {
        btn.addEventListener("click", function() {
          const container = document.getElementById("dynamicFieldsContainer");
          if (container.children.length > 1) {
            this.closest(".dynamic-field").remove();
            updateDynamicPreview();
          }
        });
      });

      updateDynamicPreview();
    }, 100);
  }

  // Las demás funciones (showClearField, showDeleteField, showEditRow, etc.) 
  // permanecen igual que antes

  function showClearField(rowId, fieldName) {
    const row = state.currentRows.find(r => r._id === rowId);
    if (!row) {
      resInfo.textContent = "Error: No se encontró la fila.";
      return;
    }

    if (fieldName === "_id" || fieldName === "_shard_id") {
      resInfo.textContent = "No se pueden eliminar campos del sistema.";
      return;
    }

    const blockName = getBlockName();
    if (!blockName) {
      resInfo.textContent = "Error: No se pudo determinar el bloque.";
      return;
    }

    const currentValue = row.data?.[fieldName];
    const displayValue = fmtCell(currentValue);

    showModal(`Eliminar campo: ${fieldName}`, `
      <p style="color:var(--txt2);margin-bottom:12px;">¿Eliminar el campo <strong style="color:var(--red);">${escapeHtml(fieldName)}</strong> de este documento?</p>
      <p style="color:var(--txt3);font-size:12px;">Valor actual: <strong style="color:var(--txt);font-family:var(--mono);">${escapeHtml(displayValue)}</strong></p>
      <p style="color:var(--txt3);font-size:12px;margin-top:8px;">El campo quedará vacío (null) en este documento.</p>
      <input type="hidden" id="clearFieldRowId" value="${escapeHtml(rowId)}" />
      <input type="hidden" id="clearFieldName" value="${escapeHtml(fieldName)}" />

      const field = document.getElementById("clearFieldName").value;
      const block = document.getElementById("clearFieldBlock").value;

      try {
        await executeQuery(`UPDATE ${block} WHERE _id = "${id}" SET ${field} = null`);
        closeModal();
        await runQuery();
        resInfo.textContent = `Campo ${field} eliminado (null) del documento ${id}.`;
      } catch (err) {
        showModalError(err.message);
      }
    });
    document.querySelector("#modalSave").className = "btn-danger";
    document.querySelector("#modalSave").textContent = "Eliminar";

  function showDeleteField(columnName) {
    const blockName = getBlockName();
    if (!blockName) {
      resInfo.textContent = "Error: No se pudo determinar el bloque.";
      return;
    }

    if (columnName === "_id" || columnName === "_shard_id") {
      resInfo.textContent = "No se pueden eliminar campos del sistema (_id, _shard_id).";

    }

    showModal(`Eliminar Columna: ${columnName}`, `
      <p style="color:var(--txt2);margin-bottom:12px;">¿Eliminar la columna <strong style="color:var(--red);">${escapeHtml(columnName)}</strong> de todos los documentos?</p>

  function showEditRow(rowId) {
    const row = state.currentRows.find(r => r._id === rowId);
    if (!row) {
      resInfo.textContent = "Error: No se encontró la fila.";
      return;
    }

    const cols = state.currentColumns.filter(c => c !== "_id" && c !== "_shard_id");
    let fieldsHtml = cols.map(c => {
      const val = row.data?.[c];
      const isArray = isArrayField(val);
      const displayVal = isArray ? JSON.stringify(val) : fmtCell(val);
      return `
      <div class="field">
        <label>${escapeHtml(c)} ${isArray ? '<span style="color:var(--acc);font-size:9px;">(array)</span>' : ''}</label>
        <input type="text" id="edit_${escapeHtml(c)}" value="${escapeHtml(displayVal)}" />
      </div>
    `}).join("");

    const blockName = getBlockName();

    showModal("Editar Documento", `
      <div class="field">
        <label>ID</label>
        <input type="text" value="${escapeHtml(rowId)}" disabled />
      </div>
      ${fieldsHtml}
      <input type="hidden" id="editRowId" value="${escapeHtml(rowId)}" />
      <input type="hidden" id="editBlockName" value="${escapeHtml(blockName || '')}" />
    `, async () => {
      const id = document.getElementById("editRowId").value;
      const block = document.getElementById("editBlockName").value;
      if (!block) {
        showModalError("No se pudo determinar el bloque.");
        return;
      }

      const updates = {};
      let hasChanges = false;
      cols.forEach(c => {
        const el = document.getElementById(`edit_${escapeHtml(c)}`);
        if (el) {
          const val = el.value;
          let parsed;
          try { parsed = JSON.parse(val); } catch { parsed = val; }
          const original = row.data?.[c];
          if (JSON.stringify(parsed) !== JSON.stringify(original)) {
            updates[c] = parsed;
            hasChanges = true;
          }
        }
      });

      if (!hasChanges) {
        showModalError("No se realizaron cambios.");
        return;
      }

      try {
        const setClause = Object.entries(updates)
          .map(([k, v]) => `${k} = ${JSON.stringify(v)}`)
          .join(", ");
        await executeQuery(`UPDATE ${block} WHERE _id = "${id}" SET ${setClause}`);
        closeModal();
        await runQuery();
        resInfo.textContent = `Documento ${id} actualizado.`;
      } catch (err) {
        showModalError(err.message);
      }
    });
  }

  function showEditArray(rowId, fieldName) {
    const row = state.currentRows.find(r => r._id === rowId);
    if (!row) {
      resInfo.textContent = "Error: No se encontró la fila.";
      return;
    }

    const arrayData = row.data?.[fieldName];
    if (!Array.isArray(arrayData)) {
      resInfo.textContent = "Error: El campo no es un array.";
      return;
    }

    let itemsHtml = arrayData.map((item, idx) => `
      <div class="array-item" data-index="${idx}">
        <input type="text" class="array-value" value="${escapeHtml(JSON.stringify(item))}" />
        <button class="remove-item" title="Eliminar"><i class="ti ti-x"></i></button>
      </div>
    `).join("");

    const blockName = getBlockName();

    showModal(`Editar Array: ${fieldName}`, `
      <div class="field">
        <label>Elementos del array</label>
        <div id="arrayItems">${itemsHtml}</div>
        <button class="add-field-btn" id="addArrayItemBtn"><i class="ti ti-plus"></i> Agregar elemento</button>
      </div>
      <input type="hidden" id="editArrayRowId" value="${escapeHtml(rowId)}" />
      <input type="hidden" id="editArrayField" value="${escapeHtml(fieldName)}" />
      <input type="hidden" id="editArrayBlock" value="${escapeHtml(blockName || '')}" />
    `, async () => {
      const id = document.getElementById("editArrayRowId").value;
      const field = document.getElementById("editArrayField").value;
      const block = document.getElementById("editArrayBlock").value;

      if (!block) {
        showModalError("No se pudo determinar el bloque.");
        return;
      }

      const items = document.querySelectorAll("#arrayItems .array-item");
      const newArray = [];
      items.forEach(el => {
        const val = el.querySelector(".array-value").value.trim();
        if (val) {
          let parsed;
          try { parsed = JSON.parse(val); } catch { parsed = val; }
          newArray.push(parsed);
        }
      });

      if (JSON.stringify(newArray) === JSON.stringify(arrayData)) {
        showModalError("No se realizaron cambios.");
        return;
      }

      try {
        await executeQuery(`UPDATE ${block} WHERE _id = "${id}" SET ${field} = ${JSON.stringify(newArray)}`);
        closeModal();
        await runQuery();
        resInfo.textContent = `Array ${field} actualizado.`;
      } catch (err) {
        showModalError(err.message);
      }
    });

    setTimeout(() => {
      document.getElementById("addArrayItemBtn")?.addEventListener("click", () => {
        const container = document.getElementById("arrayItems");
        const div = document.createElement("div");
        div.className = "array-item";
        div.innerHTML = `
          <input type="text" class="array-value" placeholder="valor" />
          <button class="remove-item" title="Eliminar"><i class="ti ti-x"></i></button>
        `;
        container.appendChild(div);
        div.querySelector(".remove-item").addEventListener("click", () => {
          if (container.children.length > 1) {
            div.remove();
          }
        });
      });

      document.querySelectorAll("#arrayItems .remove-item").forEach(btn => {
        btn.addEventListener("click", function() {
          const container = document.getElementById("arrayItems");
          if (container.children.length > 1) {
            this.closest(".array-item").remove();
          }
        });
      });
    }, 50);
  }
